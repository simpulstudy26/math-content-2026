<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>심풀스터디 수학 콘텐츠 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a1824;
        --card: #13283a;
        --ink: #e8f1f7;
        --ink-2: #93a9ba;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Noto Sans KR', system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 48px 16px;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        font-size: 28px;
        font-weight: 900;
        margin: 0 0 6px;
        letter-spacing: -0.02em;
      }
      .lead {
        color: var(--ink-2);
        margin: 0 0 32px;
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid #1f3a50;
        border-radius: 14px;
        padding: 20px 22px;
        transition: border-color 0.2s, transform 0.2s;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 19px;
      }
      .card p {
        margin: 0;
        color: var(--ink-2);
        line-height: 1.6;
        font-size: 14px;
      }
      .tags {
        margin-top: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tags span {
        font-size: 12px;
        border: 1px solid #2b475c;
        border-radius: 999px;
        padding: 2px 10px;
        color: #c9d7e2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>수학 콘텐츠 2026</h1>
      <p class="lead">심풀스터디 · 수업에서 쓰는 인터랙티브 수학 시뮬레이터</p>
      <a class="card" href="./storm-detour-lab/">
        <h2>태풍을 지나는 여행</h2>
        <p>인천에서 전 세계 공항까지 1인칭으로 날아가며, 원형 태풍을 피하는 최단 항로가 기내 노트에 한 단계씩 계산됩니다.</p>
        <div class="tags"><span>공통수학2 원과 직선</span><span>접선</span><span>피타고라스</span><span>삼각비표 선형 보간</span></div>
      </a>
    </main>
  </body>
</html>
