name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storm-detour-lab/package-lock.json

      - name: 태풍 회피 항로 — 설치·테스트·빌드
        working-directory: storm-detour-lab
        run: |
          npm ci
          npm test
          npm run build

      - name: 사이트 조립
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r storm-detour-lab/dist _site/storm-detour-lab
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
